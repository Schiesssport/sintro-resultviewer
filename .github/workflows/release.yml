name: Release

# Publishes the Windows deployment. Docker is only the local development convenience — what a
# range actually installs is this self-contained executable, so that is what a release contains.
#
# Tag a commit to publish:  git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab to get a build without creating a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the archive

jobs:
  windows:
    runs-on: ubuntu-latest    # win-x64 is cross-published; no Windows runner needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Unit tests only: the integration suite needs a restored device export, which cannot
      # be published. See ci.yml.
      - name: Test
        env:
          SINTRO_SKIP_DB_TESTS: '1'
        run: dotnet test Sintro.ResultViewer.slnx -c Release

      - name: Publish win-x64
        run: |
          dotnet publish src/Sintro.ResultViewer.Api/Sintro.ResultViewer.Api.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o bin/win-x64

      - name: Name the archive
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "archive=sintro-resultviewer-$version-win-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Zip
        run: cd bin/win-x64 && zip -r "../../${{ steps.name.outputs.archive }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: ${{ steps.name.outputs.archive }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.archive }}
          generate_release_notes: true
          body: |
            Self-contained Windows build. No .NET runtime required.

            1. Unzip next to the Sintro installation.
            2. Edit `appsettings.jsonc` — every setting is explained in the file. Set the
               connection string to the device database
               (a **read-only** SQL login). Add a token to `ApiReadTokens` only if something
               other than the bundled displays should read the API.
            3. Run `Sintro.ResultViewer.Api.exe`, then open <http://localhost:8080>. Allow it
               through the Windows firewall on private networks, so displays on the club LAN
               can reach it at `http://<this-machine>:8080` — the address is printed on start.

            Only private network ranges may connect unless configured otherwise.
