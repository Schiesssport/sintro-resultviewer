name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build Sintro.ResultViewer.slnx -c Release

      # The integration suite runs against the seeded database (seed/), the same way as on a
      # developer machine. A device export can never be committed; the seed replaces it here.
      # "Today" is pinned for both the seed and the API so a run near midnight cannot disagree.
      - name: Seed the database
        run: |
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
          SEED_TODAY="$(date -u +%F)" scripts/db-seed.sh SintroSeed

      - name: Tests
        env:
          ConnectionStrings__Sintro: "Server=localhost,11433;Database=SintroSeed;User Id=sa;Password=Sintro_Dev_2026!;TrustServerCertificate=true;Encrypt=false"
          Sintro__ReferenceDate: ${{ env.TODAY }}
        run: dotnet test Sintro.ResultViewer.slnx -c Release --no-build

      - name: Cross-publish the Windows deployment
        run: |
          dotnet publish src/Sintro.ResultViewer.Api/Sintro.ResultViewer.Api.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none -o bin/win-x64

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No build step and no dependencies — the browser loads these files as they are.
      - name: Viewer tests
        working-directory: src/Sintro.ResultViewer.Api/wwwroot
        run: node --test "tests/*.test.js"
